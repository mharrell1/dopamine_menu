<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Dopamine Menu - Y2K Retro Self-Care</title>
  <meta name="description" content="A cute Y2K Windows OS style self-care menu to help you choose feel-good activities for your day." />
  
  <!-- Retro CSS Stylesheets -->
  <link rel="stylesheet" href="css/retro-theme.css?v=9" />
  <link rel="stylesheet" href="css/category-tabs.css?v=9" />
  <link rel="stylesheet" href="css/compiled-menu.css?v=9" />

  <!-- html2canvas library for high-res social image export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <!-- PWA Manifest & Meta Tags -->
  <link rel="manifest" href="manifest.json?v=3" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png?v=3" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/icon-32x32.png?v=3" />
  <link rel="icon" type="image/png" sizes="16x16" href="assets/icons/icon-16x16.png?v=3" />
  
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js")
          .then(reg => console.log("Service Worker registered successfully:", reg.scope))
          .catch(err => console.error("Service Worker registration failed:", err));
      });
    }
  </script>
</head>
<body>

  <!-- Main App Shell -->
  <main class="app-container" id="app-container">
    
    <!-- Top Header Card with Progress Tracker -->
    <section class="app-header-card" aria-label="Header and Progress">
      <h1 class="app-main-title">My Dopamine Menu</h1>
      
      <div class="progress-container">
        <div class="progress-text-row">
          <span id="progress-count-text">0 of 5 categories filled</span>
        </div>
        <div class="progress-bar-track">
          <div class="progress-bar-fill" id="progress-fill-bar"></div>
        </div>
      </div>
    </section>

    <!-- Category Tab Bar -->
    <nav class="category-tabs-container" id="category-tabs-nav" aria-label="Category Tabs">
      <!-- Injected dynamically by js/app.js -->
    </nav>

    <!-- Active Category Window -->
    <section class="active-category-container" id="active-category-window" aria-live="polite">
      <!-- Injected dynamically by js/app.js -->
    </section>

    <!-- Settings Modal (hidden by default) -->
    <div class="compiled-modal-backdrop hidden" id="settings-modal" aria-label="Settings Modal">
      <div class="modal-window-wrapper settings-modal-wrapper">
        <!-- Title Bar -->
        <div class="modal-window-header">
          <span>Settings</span>
          <button class="win-btn win-close" id="settings-modal-close" aria-label="Close">X</button>
        </div>
        <!-- Modal Body Content -->
        <div class="modal-window-body settings-modal-body">
          <div class="settings-popover-row">
            <span class="settings-popover-title">Wallpapers:</span>
            <div class="wallpaper-swatches" id="wallpaper-swatches">
              <!-- Injected by app.js -->
            </div>
            <input type="file" id="wallpaper-upload-input" accept="image/*" class="hidden" />
          </div>
          <div class="settings-popover-row">
            <span class="settings-popover-title">Theme Color:</span>
            <div class="theme-swatches" id="theme-swatches">
              <!-- Injected by app.js -->
            </div>
          </div>
          <hr class="settings-divider" />
          <div class="settings-account-section" id="settings-account-section">
            <!-- Injected by app.js -->
          </div>
          <div class="settings-archive-section" id="settings-archive-section">
            <!-- Injected by app.js -->
          </div>
        </div>
      </div>
    </div>

    <!-- Sticky Bottom Actions -->
    <footer class="bottom-action-bar" id="bottom-action-bar">
      <button id="settings-gear-btn" class="retro-btn gear-btn" aria-label="Settings" title="Settings">
        <span class="gear-icon-inner">&#9881;</span>
      </button>
      <button id="global-shuffle-btn" class="retro-btn shuffle-main-btn" aria-label="Shuffle Menu">
        Shuffle
      </button>
      <button id="see-my-menu-btn" class="retro-btn see-menu-main-btn" aria-label="See My Menu">
        See my menu -&gt;
      </button>
    </footer>

  </main>

  <!-- Compiled Dopamine Menu Modal ("See My Menu") -->
  <div id="compiled-menu-modal" class="compiled-modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-window-wrapper">
      
      <!-- Modal Title Bar -->
      <div class="modal-window-header">
        <span id="modal-title">Dopamine Menu - Your Order</span>
        <button id="modal-close-btn" class="win-btn win-close" aria-label="Close Modal">X</button>
      </div>

      <!-- Modal Body with 2-1-2 Card & Export Buttons -->
      <div class="modal-window-body">
        
        <!-- Render Container for 2-1-2 Card -->
        <div id="compiled-card-container"></div>

        <!-- Export Actions Toolbar -->
        <div class="modal-actions-bar">
          <button id="download-image-btn" class="retro-btn modal-action-btn btn-primary-action">
            Download PNG Image
          </button>
          <button id="copy-checklist-btn" class="retro-btn modal-action-btn btn-secondary-action">
            Copy Checklist Text
          </button>
          <button id="reset-menu-btn" class="retro-btn modal-action-btn btn-secondary-action">
            Reset All
          </button>
        </div>

      </div>
    </div>
  </div>

  <!-- Image Save / Share Preview Modal (Optimized for Mobile Save to Photos) -->
  <div id="image-preview-modal" class="compiled-modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="preview-modal-title">
    <div class="modal-window-wrapper preview-modal-wrapper">
      <div class="modal-window-header">
        <span id="preview-modal-title">Save / Share Menu Image</span>
        <button id="preview-modal-close-btn" class="win-btn win-close" aria-label="Close Preview Modal">X</button>
      </div>
      <div class="modal-window-body preview-modal-body">
        <div class="preview-instruction-box">
          <span class="preview-tip-badge">MOBILE TIP</span>
          <span class="preview-tip-text">Tap &amp; hold (long-press) the image to save directly to your Photos!</span>
        </div>
        
        <div class="preview-image-scroll-wrapper">
          <img id="preview-exported-image" src="" alt="Dopamine Menu Preview" class="preview-exported-image" />
        </div>

        <div class="modal-actions-bar preview-actions-bar">
          <button id="preview-share-btn" class="retro-btn modal-action-btn btn-primary-action">
            Share / Save to Photos
          </button>
          <button id="preview-download-btn" class="retro-btn modal-action-btn btn-secondary-action">
            Download File
          </button>
          <button id="preview-close-action-btn" class="retro-btn modal-action-btn btn-secondary-action">
            Done
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast Notification Overlay -->
  <div id="retro-notice-toast" class="retro-toast" role="alert" aria-live="assertive"></div>

  <!-- App Script Entrypoint -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
